<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AI Resume and Job Matcher pipeline: upload, extract, skills, embed, score, improve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <text x="48" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC">AI Resume &amp;</text>
  <text x="48" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC">Job Matcher</text>
  <text x="48" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94A3B8">Upload a resume, paste a job description,</text>
  <text x="48" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94A3B8">get a match score and skill gaps.</text>

  <rect x="520" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="565" cy="128" r="22" fill="url(#accent)"/>
  <text x="565" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
  <text x="565" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Upload</text>
  <text x="620" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#64748B">&#8250;</text>

  <rect x="630" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="675" cy="128" r="22" fill="url(#accent)"/>
  <text x="675" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
  <text x="675" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Extract</text>
  <text x="730" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#64748B">&#8250;</text>

  <rect x="740" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="785" cy="128" r="22" fill="url(#accent)"/>
  <text x="785" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
  <text x="785" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Skills</text>
  <text x="840" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#64748B">&#8250;</text>

  <rect x="850" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="895" cy="128" r="22" fill="url(#accent)"/>
  <text x="895" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
  <text x="895" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Embed</text>
  <text x="950" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#64748B">&#8250;</text>

  <rect x="960" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="1005" cy="128" r="22" fill="url(#accent)"/>
  <text x="1005" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
  <text x="1005" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Score</text>
  <text x="1060" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#64748B">&#8250;</text>

  <rect x="1070" y="90" width="90" height="120" rx="14" fill="#1E293B" stroke="#334155"/>
  <circle cx="1115" cy="128" r="22" fill="url(#accent)"/>
  <text x="1115" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
  <text x="1115" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#CBD5E1">Improve</text>
</svg>